<div class="section">
  <p class="sectionTitle">ប្រធាន</p>
  <ol class="Roman">
    <li>គេមានអនុគមន៍$f$ដែល$f(x)=\dfrac{x^2+3x+6}{x+1}$ និងមានក្រាបតាងដោយ$C$។
      <ol>
        <li>រកដែនកំណត់នៃអនុគមន៍$f$។</li>
        <li>បង្ហាញថា$f(x)=x+2+\dfrac{4}{x+1}$។</li>
        <li>រកសមីការអាស៊ីមតូតឈរ និងទ្រេតនៃក្រាប$C$។</li>
        <li>សិក្សាអថេរភាពនិងសង់ក្រាប$C$នៃអនុគមន៍$f$។</li>
      </ol>
    </li>
  </ol>
</div>
